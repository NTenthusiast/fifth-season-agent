<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" fill="none">
  <!-- 第五季·续种 专属 Logo「五季续种花环」
       五瓣 = 春夏秋冬 + 第五季；中心 = 破土新芽 -->
  <defs>
    <linearGradient id="lgSpring" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9ed8b0"/><stop offset="1" stop-color="#4e9e6b"/>
    </linearGradient>
    <linearGradient id="lgSummer" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7d98d"/><stop offset="1" stop-color="#dfa12e"/>
    </linearGradient>
    <linearGradient id="lgAutumn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f5b48c"/><stop offset="1" stop-color="#d97444"/>
    </linearGradient>
    <linearGradient id="lgWinter" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a9c8ee"/><stop offset="1" stop-color="#5c86c4"/>
    </linearGradient>
    <linearGradient id="lgFifth" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c3a8f5"/><stop offset="1" stop-color="#7b5cd6"/>
    </linearGradient>
    <radialGradient id="lgCore" cx=".38" cy=".32" r=".9">
      <stop offset="0" stop-color="#a58af0"/><stop offset="1" stop-color="#5b3fb8"/>
    </radialGradient>
  </defs>

  <g transform="translate(48,48)">
    <!-- 春（正上） -->
    <path d="M0 -12.5 C6.6 -23.5 7.2 -35.5 0 -43 C-7.2 -35.5 -6.6 -23.5 0 -12.5 Z" fill="url(#lgSpring)"/>
    <!-- 夏（右上 72°） -->
    <path d="M0 -12.5 C6.6 -23.5 7.2 -35.5 0 -43 C-7.2 -35.5 -6.6 -23.5 0 -12.5 Z" transform="rotate(72)" fill="url(#lgSummer)"/>
    <!-- 秋（右下 144°） -->
    <path d="M0 -12.5 C6.6 -23.5 7.2 -35.5 0 -43 C-7.2 -35.5 -6.6 -23.5 0 -12.5 Z" transform="rotate(144)" fill="url(#lgAutumn)"/>
    <!-- 冬（左下 216°） -->
    <path d="M0 -12.5 C6.6 -23.5 7.2 -35.5 0 -43 C-7.2 -35.5 -6.6 -23.5 0 -12.5 Z" transform="rotate(216)" fill="url(#lgWinter)"/>
    <!-- 第五季（左上 288°，微微发亮的品牌紫） -->
    <path d="M0 -12.5 C6.6 -23.5 7.2 -35.5 0 -43 C-7.2 -35.5 -6.6 -23.5 0 -12.5 Z" transform="rotate(288)" fill="url(#lgFifth)"/>
  </g>

  <!-- 中心：传承之核 -->
  <circle cx="48" cy="48" r="13" fill="url(#lgCore)"/>
  <circle cx="48" cy="48" r="13" fill="none" stroke="#ffffff" stroke-opacity=".55" stroke-width="1.4"/>
  <!-- 破土新芽：一茎双子叶 -->
  <path d="M48 55 C48 51.2 47.1 48.4 44.6 46.6" stroke="#ffffff" stroke-width="2.1" stroke-linecap="round" fill="none"/>
  <path d="M44.6 46.6 C41.9 44.9 40.7 42.2 41.1 39.6 C43.8 40.7 45.5 43.3 45.0 46.4 Z" fill="#ffffff"/>
  <path d="M48 55 C48 51.8 48.9 49.3 51.3 47.7" stroke="#ffffff" stroke-width="2.1" stroke-linecap="round" fill="none"/>
  <path d="M51.3 47.7 C53.8 46.5 54.9 44.5 54.7 42.2 C52.3 43.1 50.5 45.1 50.3 47.5 Z" fill="#ffffff" fill-opacity=".92"/>
</svg>
